<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engagement Invitation | Akash & Sayli</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Great+Vibes&family=Marcellus&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            script: ['"Great Vibes"', 'cursive'],
            marcellus: ['Marcellus', 'serif'],
            poppins: ['Poppins', 'sans-serif'],
            playfair: ['"Playfair Display"', 'serif'],
          },
          colors: {
            gold: {
              DEFAULT: '#D4AF37',
              light: '#FFEAA7',
              dark: '#C5A059',
            },
            ruby: {
              DEFAULT: '#800A21',
              dark: '#580614',
              bright: '#A31832',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles & Animations -->
  <style>
    .box-shadow-gold {
      box-shadow: 0 10px 40px -10px rgba(212, 175, 55, 0.25);
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spinSlow 20s linear infinite;
    }
    @keyframes floatAnim {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animate-float {
      animation: floatAnim 4s ease-in-out infinite;
    }
    @keyframes petalFall {
      0% { transform: translateY(-30px) rotate(0deg) translateX(0px); opacity: 0.9; }
      50% { transform: translateY(50vh) rotate(180deg) translateX(30px); opacity: 0.8; }
      100% { transform: translateY(105vh) rotate(360deg) translateX(-20px); opacity: 0.2; }
    }
    .animate-petal {
      animation-name: petalFall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
      50% { box-shadow: 0 0 30px rgba(212, 175, 55, 0.8); }
    }
    .animate-pulse-glow {
      animation: pulseGlow 2s ease-in-out infinite;
    }
  </style>

</head>
<body class="bg-[#FFFDFB] text-[#2D1518] font-poppins selection:bg-[#D4AF37] selection:text-white relative">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
